<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#07192e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#040b14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020509" stop-opacity="1"/>
    </radialGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00c0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Deep Blue / Violet Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052d4"/>
      <stop offset="50%" stop-color="#4364f7"/>
      <stop offset="100%" stop-color="#6fb1fc"/>
    </linearGradient>

    <!-- Wing Shadow / Secondary Blade -->
    <linearGradient id="darkWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2b45"/>
      <stop offset="100%" stop-color="#05131f"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Tech Ring -->
  <circle cx="400" cy="400" r="370" fill="url(#bgGlow)" stroke="#003b6f" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.3"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="#0051ff" stroke-width="1" stroke-dasharray="16 8 4 8" opacity="0.4"/>

  <!-- Tech Arc Accents -->
  <path d="M 120 400 A 280 280 0 0 1 400 120" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#neonGlow)"/>
  <path d="M 680 400 A 280 280 0 0 1 400 680" fill="none" stroke="#00c0ff" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#neonGlow)"/>

  <!-- Left Main Wing Blades (Stealth Polygon Geometry) -->
  <g id="leftWing" filter="url(#neonGlow)">
    <!-- Primary Top Outer Wing -->
    <polygon points="400,240 290,140 180,180 260,260 380,290" fill="url(#cyanGlow)" opacity="0.95"/>
    <polygon points="380,290 240,240 130,280 230,340 370,350" fill="url(#accentGrad)" opacity="0.9"/>
    <polygon points="370,350 210,330 110,380 210,420 360,400" fill="url(#cyanGlow)" opacity="0.85"/>
    <polygon points="360,400 200,410 130,470 230,480 360,450" fill="url(#accentGrad)" opacity="0.8"/>
    <!-- Lower Feather Blades -->
    <polygon points="360,450 220,480 180,540 280,520 370,490" fill="url(#darkWing)" stroke="#00f2fe" stroke-width="1.5" opacity="0.9"/>
    <polygon points="370,490 270,530 250,590 340,550 380,520" fill="url(#cyanGlow)" opacity="0.7"/>
  </g>

  <!-- Right Main Wing Blades (Mirrored Symmetry) -->
  <g id="rightWing" filter="url(#neonGlow)">
    <!-- Primary Top Outer Wing -->
    <polygon points="400,240 510,140 620,180 540,260 420,290" fill="url(#cyanGlow)" opacity="0.95"/>
    <polygon points="420,290 560,240 670,280 570,340 430,350" fill="url(#accentGrad)" opacity="0.9"/>
    <polygon points="430,350 590,330 690,380 590,420 440,400" fill="url(#cyanGlow)" opacity="0.85"/>
    <polygon points="440,400 600,410 670,470 570,480 440,450" fill="url(#accentGrad)" opacity="0.8"/>
    <!-- Lower Feather Blades -->
    <polygon points="440,450 580,480 620,540 520,520 430,490" fill="url(#darkWing)" stroke="#00f2fe" stroke-width="1.5" opacity="0.9"/>
    <polygon points="430,490 530,530 550,590 460,550 420,520" fill="url(#cyanGlow)" opacity="0.7"/>
  </g>

  <!-- Central Crest & Body (Layered Stealth Armor) -->
  <polygon points="400,280 340,360 360,470 400,560 440,470 460,360" fill="#041221" stroke="#00f2fe" stroke-width="2"/>
  <polygon points="400,310 360,380 380,470 400,530 420,470 440,380" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Eagle Tail Feathers -->
  <polygon points="400,540 370,640 400,680 430,640" fill="url(#cyanGlow)" filter="url(#neonGlow)"/>
  <polygon points="400,570 385,650 400,670 415,650" fill="#ffffff" opacity="0.8"/>

  <!-- Eagle Head & Predatory Beak (Frontal Crown with Aggressive Profile) -->
  <!-- Crown Feathers -->
  <polygon points="400,150 370,210 400,240 430,210" fill="#ffffff" filter="url(#neonGlow)"/>
  <polygon points="370,180 350,230 380,250" fill="url(#cyanGlow)"/>
  <polygon points="430,180 450,230 420,250" fill="url(#cyanGlow)"/>

  <!-- Head Structure -->
  <polygon points="400,210 360,250 370,290 400,310 430,290 440,250" fill="#071b2e" stroke="#00f2fe" stroke-width="2"/>
  <polygon points="400,220 380,260 400,290 420,260" fill="url(#cyanGlow)" opacity="0.7"/>

  <!-- Predatory Eyes (Electric Neon Cyan Slits) -->
  <polygon points="375,255 388,252 385,260" fill="#ffffff" filter="url(#strongGlow)"/>
  <polygon points="425,255 412,252 415,260" fill="#ffffff" filter="url(#strongGlow)"/>

  <!-- Razor Beak (Aggressive Sharp Downward Hook) -->
  <polygon points="400,260 385,295 400,345 415,295" fill="url(#cyanGlow)" filter="url(#strongGlow)"/>
  <polygon points="400,270 392,295 400,335 408,295" fill="#ffffff" opacity="0.9"/>
  <!-- Beak Tip Light Point -->
  <circle cx="400" cy="345" r="3" fill="#ffffff" filter="url(#strongGlow)"/>

  <!-- Energy Core / Heart Node -->
  <circle cx="400" cy="430" r="14" fill="#00f2fe" filter="url(#strongGlow)"/>
  <circle cx="400" cy="430" r="7" fill="#ffffff"/>

  <!-- Circuit Trace Lines from Core -->
  <line x1="400" y1="444" x2="400" y2="530" stroke="#00f2fe" stroke-width="3" filter="url(#neonGlow)"/>
  <line x1="386" y1="430" x2="310" y2="430" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
  <line x1="310" y1="430" x2="280" y2="400" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
  <circle cx="280" cy="400" r="4" fill="#00f2fe"/>

  <line x1="414" y1="430" x2="490" y2="430" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
  <line x1="490" y1="430" x2="520" y2="400" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
  <circle cx="520" cy="400" r="4" fill="#00f2fe"/>

  <!-- Bottom Typography: AIRLYS -->
  <text x="400" y="735" font-family="'Orbitron', 'Inter', 'Segoe UI', sans-serif" font-size="42" font-weight="900" letter-spacing="14" fill="#ffffff" text-anchor="middle" filter="url(#neonGlow)">AIRLYS</text>
  <text x="400" y="765" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="6" fill="#00f2fe" text-anchor="middle" opacity="0.9">SOVEREIGN OS KERNEL</text>
</svg>
