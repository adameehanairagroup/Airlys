name: Build Airlys OS S1 Production ISO

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/screenshot.yml'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Airlys OS S1 Live ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged --device=/dev/loop-control

    steps:
      - name: Check Free Disk Space
        run: df -h

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Initialize Keyring & Install Archiso
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso git github-cli

      - name: Build Airlys OS S1 Live ISO
        run: |
          mkdir -p /mnt/work out bin build_profile
          # 1. Copy official verified releng profile (includes all verified syslinux, efiboot, systemd-boot structures)
          cp -r /usr/share/archiso/configs/releng/* build_profile/
          
          # 2. Prune bloated rescue / VM guest agent packages from releng (Nitro V 15 is a physical gaming laptop)
          sed -i -E '/^(cloud-init|open-vm-tools|virtualbox-guest-utils-nox|hyperv|qemu-guest-agent|clonezilla|partclone|partimage|testdisk|espeakup|brltty|man-pages|man-db|irssi|lynx|darkhttpd|ddrescue|refind|livecd-sounds|grml-zsh-config|archinstall|nmap|tcpdump|openvpn|openconnect|lftp|modemmanager|usb_modeswitch|usbmuxd|bcachefs-tools|f2fs-tools|nilfs-utils|jfsutils|udftools|dmraid|tpm2-tools|tpm2-tss|pcsclite|openpgp-card-tools|sequoia-sq|ppp|pptpclient|wvdial|xl2tpd)$/d' build_profile/packages.x86_64
          
          # 3. Append KDE Plasma 6 desktop & AMD hardware packages
          cat profile/packages.x86_64 >> build_profile/packages.x86_64
          
          # 4. Brand bootloader menus with Airlys OS S1 (remove all third party names)
          find build_profile/efiboot build_profile/syslinux -type f -exec sed -i \
            -e 's/Arch Linux install medium/Airlys OS S1 Live \& Installer/g' \
            -e 's/Arch Linux/Airlys OS S1/g' \
            -e 's/archlinux/airlys/g' \
            -e 's/Archiso/Airlys OS/g' {} +
          
          # 5. Enable Graphical Desktop Target & SDDM Display Manager (ensures direct boot to KDE GUI!)
          mkdir -p build_profile/airootfs/etc/systemd/system/graphical.target.wants/
          ln -sf /usr/lib/systemd/system/graphical.target build_profile/airootfs/etc/systemd/system/default.target
          ln -sf /usr/lib/systemd/system/sddm.service build_profile/airootfs/etc/systemd/system/display-manager.service
          ln -sf /usr/lib/systemd/system/sddm.service build_profile/airootfs/etc/systemd/system/graphical.target.wants/sddm.service
          
          # 6. Overlay our Airlys OS S1 branding, wallpapers, autologin and configs
          cp -r profile/airootfs/* build_profile/airootfs/
          
          # 7. Pre-create airlys user with passwordless PAM autologin directly in airootfs
          echo "airlys:x:1000:1000:Airlys User:/home/airlys:/bin/bash" >> build_profile/airootfs/etc/passwd
          echo "airlys::19000:0:99999:7:::" >> build_profile/airootfs/etc/shadow
          echo "airlys:x:1000:" >> build_profile/airootfs/etc/group
          echo "wheel:x:998:airlys" >> build_profile/airootfs/etc/group
          echo "video:x:985:airlys" >> build_profile/airootfs/etc/group
          echo "audio:x:986:airlys" >> build_profile/airootfs/etc/group
          echo "input:x:987:airlys" >> build_profile/airootfs/etc/group
          mkdir -p build_profile/airootfs/home/airlys/.config
          cp -r build_profile/airootfs/etc/skel/. build_profile/airootfs/home/airlys/ || true
          chown -R 1000:1000 build_profile/airootfs/home/airlys || true
          
          # 8. Apply Airlys OS S1 profiledef (xz -Xbcj x86 compression)
          cp -f profile/profiledef.sh build_profile/profiledef.sh
          
          # 6. Build full production live bootable ISO
          mkarchiso -v -w /mnt/work -o out build_profile/
          ls -lh out/
          cp -v out/*.iso bin/airlys.iso
          sha256sum bin/airlys.iso > bin/sha256sum.txt

      - name: Upload Airlys OS S1 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airlys-live-bootable-iso
          path: |
            bin/airlys.iso
            bin/sha256sum.txt
          retention-days: 14

      - name: Publish to GitHub Release v1.0.0-s1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO_SIZE=$(stat -c%s bin/airlys.iso)
          echo "ISO size is $ISO_SIZE bytes"
          
          # Delete previous release and tag if it exists so we recreate it cleanly
          gh release delete v1.0.0-s1 --yes --cleanup-tag --repo ${{ github.repository }} || true
          
          if [ "$ISO_SIZE" -lt 2100000000 ]; then
            echo "ISO is under 2GB limit! Uploading direct single airlys.iso..."
            gh release create v1.0.0-s1 bin/airlys.iso bin/sha256sum.txt \
              --title "Airlys OS S1 - Official Production Release" \
              --notes "Airlys OS S1 Official Production Release engineered by Er. Adam Eehan (Founder & CEO, Aira Group of Technology) & Aira 3 Ultra. Direct bootable ISO for Acer Nitro V 15 & modern UEFI PCs." \
              --repo ${{ github.repository }}
          else
            echo "ISO exceeds 2GB limit ($ISO_SIZE bytes), splitting into parts for GitHub Releases..."
            cd bin
            split -b 1500M airlys.iso airlys.iso.part-
            cd ..
            gh release create v1.0.0-s1 bin/airlys.iso.part-* bin/sha256sum.txt \
              --title "Airlys OS S1 - Official Production Release" \
              --notes "Airlys OS S1 Official Production Release engineered by Er. Adam Eehan (Founder & CEO, Aira Group of Technology) & Aira 3 Ultra. Direct bootable ISO for Acer Nitro V 15 & modern UEFI PCs." \
              --repo ${{ github.repository }}
          fi
