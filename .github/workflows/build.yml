name: Build Airlys OS S1 Production ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Airlys OS S1 Live ISO (KDE Plasma 6)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged --device=/dev/loop-control

    steps:
      - name: Check Free Disk Space
        run: df -h

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Initialize Keyring & Install Archiso
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso git

      - name: Build Airlys OS S1 Live ISO
        run: |
          mkdir -p /mnt/work out bin
          mkarchiso -v -w /mnt/work -o out ./profile
          ls -lh out/
          cp -v out/*.iso bin/airlys.iso
          sha256sum bin/airlys.iso > bin/sha256sum.txt

      - name: Upload Airlys OS S1 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airlys-live-bootable-iso
          path: |
            bin/airlys.iso
            bin/sha256sum.txt
          retention-days: 14
