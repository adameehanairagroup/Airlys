name: Build Airlys OS S1 Production ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Airlys OS S1 Live ISO (KDE Plasma 6)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged --device=/dev/loop-control

    steps:
      - name: Check Free Disk Space
        run: df -h

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Initialize Keyring & Install Archiso
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso git

      - name: Build Airlys OS S1 Live ISO
        run: |
          mkdir -p /mnt/work out bin build_profile
          # 1. Copy official verified releng profile (includes all verified syslinux, efiboot, systemd-boot structures)
          cp -r /usr/share/archiso/configs/releng/* build_profile/
          
          # 2. Append KDE Plasma 6 desktop & AMD hardware packages
          cat profile/packages.x86_64 >> build_profile/packages.x86_64
          
          # 3. Overlay our Airlys OS S1 branding, wallpapers, autologin and configs
          cp -r profile/airootfs/* build_profile/airootfs/
          
          # 4. Apply Airlys OS S1 profiledef
          cp -f profile/profiledef.sh build_profile/profiledef.sh
          
          # 5. Build full production live bootable ISO
          mkarchiso -v -w /mnt/work -o out build_profile/
          ls -lh out/
          cp -v out/*.iso bin/airlys.iso
          sha256sum bin/airlys.iso > bin/sha256sum.txt

      - name: Upload Airlys OS S1 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airlys-live-bootable-iso
          path: |
            bin/airlys.iso
            bin/sha256sum.txt
          retention-days: 14
